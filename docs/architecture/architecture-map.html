<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinSight Architecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a lane-based system map (left to right = request path) with a live
   inspector beside it; flows animate packets across the map; API catalogue and
   engineering practices below, each wired back to the map. Terminal violet,
   taken from FinSight's own theme. */
:root {
  --bg: #f5f4f9; --panel: #ffffff; --panel-2: #efedf6; --line: #dcd8e8; --line-2: #c4bfd6;
  --fg: #1a1730; --muted: #5d5878; --faint: #8b86a3;
  --accent: #6a4ad1; --accent-ink: #ffffff; --glow: rgba(106,74,209,.22);
  --c-client: #6a4ad1; --c-edge: #0a7fb5; --c-domain: #0e8a72; --c-storage: #b26a00; --c-external: #c2366b; --c-tool: #6b5bd6;
  --tint-client: rgba(106,74,209,.07); --tint-edge: rgba(10,127,181,.07); --tint-domain: rgba(14,138,114,.07);
  --tint-storage: rgba(178,106,0,.08); --tint-external: rgba(194,54,107,.07); --tint-tool: rgba(107,91,214,.07);
  --get: #0e8a72; --post: #b26a00; --del: #c2366b; --patch: #0a7fb5; --sse: #6a4ad1;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #09090f; --panel: #10101a; --panel-2: #161624; --line: #23233a; --line-2: #34344f;
  --fg: #e3e2ee; --muted: #a09fb8; --faint: #6f6e8a;
  --accent: #a78bfa; --accent-ink: #120d24; --glow: rgba(167,139,250,.28);
  --c-client: #a78bfa; --c-edge: #4cb8ec; --c-domain: #3fcfa6; --c-storage: #f0b44c; --c-external: #f27aa6; --c-tool: #9d8ff5;
  --tint-client: rgba(167,139,250,.07); --tint-edge: rgba(76,184,236,.06); --tint-domain: rgba(63,207,166,.06);
  --tint-storage: rgba(240,180,76,.06); --tint-external: rgba(242,122,166,.06); --tint-tool: rgba(157,143,245,.07);
  --get: #3fcfa6; --post: #f0b44c; --del: #f27aa6; --patch: #4cb8ec; --sse: #a78bfa;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #09090f; --panel: #10101a; --panel-2: #161624; --line: #23233a; --line-2: #34344f;
  --fg: #e3e2ee; --muted: #a09fb8; --faint: #6f6e8a;
  --accent: #a78bfa; --accent-ink: #120d24; --glow: rgba(167,139,250,.28);
  --c-client: #a78bfa; --c-edge: #4cb8ec; --c-domain: #3fcfa6; --c-storage: #f0b44c; --c-external: #f27aa6; --c-tool: #9d8ff5;
  --tint-client: rgba(167,139,250,.07); --tint-edge: rgba(76,184,236,.06); --tint-domain: rgba(63,207,166,.06);
  --tint-storage: rgba(240,180,76,.06); --tint-external: rgba(242,122,166,.06); --tint-tool: rgba(157,143,245,.07);
  --get: #3fcfa6; --post: #f0b44c; --del: #f27aa6; --patch: #4cb8ec; --sse: #a78bfa;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font: 14px/1.55 var(--f-body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
.wrap { max-width: 1480px; margin: 0 auto; display: grid; gap: 22px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: grid; gap: 14px; padding-block: 28px 4px; }
.eyebrow { font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font: 700 clamp(30px, 4.4vw, 48px)/1.02 var(--f-display); letter-spacing: -.01em; text-wrap: balance; }
.lede { margin: 0; max-width: 70ch; color: var(--muted); font-size: 15px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; font: 12px/1.3 var(--f-mono); color: var(--muted); }
.stats b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
.crosslink { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--glow); }
.crosslink:hover { border-color: var(--accent); }

/* ---- flow console ---- */
.console { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; align-items: center; }
.flows { display: flex; flex-wrap: wrap; gap: 6px; }
.flow-btn { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; color: var(--muted); transition: border-color .15s, color .15s, background .15s; }
.flow-btn:hover { color: var(--fg); border-color: var(--accent); }
.flow-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.transport { display: flex; gap: 6px; align-items: center; }
.icon-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; display: grid; place-items: center; }
.icon-btn:hover { border-color: var(--accent); }
.icon-btn svg { width: 14px; height: 14px; fill: currentColor; }
.speed { font: 12px var(--f-mono); color: var(--muted); display: flex; gap: 6px; align-items: center; }
.speed select { background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 6px; font: inherit; color: var(--fg); }

/* ---- stage ---- */
.stage { display: block; }
.mapbox { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
.mapbox:fullscreen { border-radius: 0; border: 0; background: var(--bg); padding: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px)); }
.mapbox:fullscreen .mapscroll { height: auto; flex: 1; }
.mapscroll { position: relative; height: clamp(440px, calc(100vh - 150px), 980px); overflow: hidden; touch-action: none; cursor: grab; user-select: none; }
.mapscroll.panning { cursor: grabbing; }
.zoombar { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 4px; padding: 4px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.zoombar button { min-width: 32px; height: 30px; padding: 0 8px; border: 0; border-radius: 7px; background: transparent; cursor: pointer; font: 600 13px var(--f-mono); color: var(--fg); }
.zoombar button:hover { background: var(--panel-2); }
.zoombar button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.zoombar { opacity: .6; transition: opacity .2s; }
.zoombar:hover, .zoombar:focus-within { opacity: 1; }
.zoombar .zitems { display: flex; gap: 4px; }
.zoombar.collapsed { padding: 3px; }
.zoombar.collapsed .zitems { display: none; }
.zoombar .ztoggle svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; vertical-align: middle; }
.zoombar .zsep { width: 1px; margin: 4px 4px; background: var(--line-2); }
.stage.side { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.stage.side .insp { position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); right: auto; width: auto; max-height: calc(100vh - 24px); box-shadow: none; border-color: var(--line); }
.stage.side .insp-x { display: none; }
@media (max-width: 1100px) { .stage.side { grid-template-columns: minmax(0, 1fr); } .stage.side .insp { position: static; max-height: none; } }
.zoombar .zl { font: 11px/30px var(--f-mono); color: var(--muted); min-width: 44px; text-align: center; }
.hint { position: absolute; right: 12px; bottom: 14px; font: 11px var(--f-mono); color: var(--faint); pointer-events: none; }
svg#map { display: block; width: 100%; height: 100%; font-family: var(--f-body); }
.narr { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 8px; }
.narr-now { display: flex; gap: 12px; align-items: baseline; min-height: 40px; }
.narr-count { font: 500 12px var(--f-mono); color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
.narr-text { font-size: 14px; }
.narr-text code, .insp code, .api code, .prac code { font: 12.5px var(--f-mono); background: var(--panel-2); border-radius: 4px; padding: 0 4px; }
.steps { display: flex; gap: 4px; }
.steps button { flex: 1; height: 5px; border: 0; border-radius: 3px; background: var(--line); cursor: pointer; padding: 0; transition: background .2s; }
.steps button.done { background: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.steps button.on { background: var(--accent); }

/* svg pieces */
.lane-title { font: 600 12px var(--f-display); letter-spacing: .12em; text-transform: uppercase; }
.lane-sub { font: 10.5px var(--f-mono); fill: var(--faint); }
.edge { fill: none; stroke: var(--line-2); stroke-width: 1.3; transition: stroke .2s, opacity .2s; }
.edge.opt { stroke-dasharray: 4 4; }
.edge.flowing { stroke-dasharray: 3 7; animation: dash 1.6s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -20; } }
.edge.hot { stroke: var(--accent); stroke-width: 2; opacity: 1; }
.zone { fill-opacity: .45; stroke-opacity: .35; stroke-width: 1; stroke-dasharray: 2 6; stroke-linecap: round; }
.dot { fill: var(--line); }
.node { cursor: pointer; transition: opacity .25s; }
.node .shape { fill: var(--panel); stroke-width: 1.4; transition: fill .2s, stroke-width .2s, filter .25s; }
.node .shape.back { fill: var(--panel); stroke-opacity: .45; stroke-width: 1.1; }
.node .shape.dashed { stroke-dasharray: 6 4; }
.node .lid { fill: var(--panel-2); stroke-width: 1.4; }
.node .ring { fill: none; stroke-width: 1.1; stroke-opacity: .55; }
.node .ibg { fill-opacity: .13; }
.node .ico { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.node .tt { font: 8.5px var(--f-mono); fill: var(--faint); }
.node .led { animation: blink 2.4s ease-in-out infinite; }
@keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
.node .pulse { fill: none; stroke-width: 7; stroke-opacity: .18; animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0%, 100% { stroke-opacity: .05; } 50% { stroke-opacity: .32; } }
.node text.nm { font: 600 13px var(--f-body); fill: var(--fg); }
.node text.pt { font: 10.5px var(--f-mono); fill: var(--faint); }
.node:hover .shape:not(.back) { stroke-width: 2.3; }
.node.sel .shape:not(.back) { stroke-width: 2.6; }
.node.act .shape:not(.back) { fill: var(--panel-2); stroke-width: 2.6; filter: drop-shadow(0 0 8px var(--glow)); }
.node:focus-visible { outline: none; }
.node:focus-visible .shape:not(.back) { stroke-width: 3; }
svg.dimming .node:not(.lit) { opacity: .42; }
svg.dimming .edge:not(.hot) { opacity: .15; }
.packet { pointer-events: none; }
.pathtmp { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; opacity: .85; }
.pathtmp.ret { stroke-dasharray: 5 5; }
.edge-label { font: 10px var(--f-mono); fill: var(--muted); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; pointer-events: none; }

/* inspector */
.insp { background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px; padding: 18px; display: grid; gap: 14px; align-content: start; position: absolute; top: 12px; right: 12px; width: min(360px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto; box-shadow: 0 18px 48px rgba(0,0,0,.28); z-index: 2; }
.insp[hidden] { display: none; }
.insp-x { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; color: var(--muted); }
.insp-x:hover { color: var(--fg); border-color: var(--accent); }
svg.flat .node { opacity: 1 !important; } svg.flat .edge { opacity: 1 !important; }
.insp-kicker { display: flex; align-items: center; gap: 8px; font: 500 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.insp h2 { margin: 0; font: 700 24px/1.1 var(--f-display); text-wrap: balance; }
.insp .path { font: 12px var(--f-mono); color: var(--muted); word-break: break-all; }
.insp p { margin: 0; color: var(--muted); }
.insp h3 { margin: 0 0 6px; font: 600 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.insp ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 9px; font: 12px var(--f-body); background: transparent; cursor: pointer; color: var(--fg); }
.chip:hover { border-color: var(--accent); }
.tag { border-radius: 4px; padding: 1px 7px; font: 11.5px var(--f-mono); background: var(--panel-2); color: var(--muted); }

/* legend */
.legend { display: flex; flex-wrap: wrap; gap: 8px; }
.leg { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; }
.leg[aria-pressed="false"] { opacity: .45; }
.leg:hover { border-color: var(--line-2); }

/* sections */
section.block { display: grid; gap: 14px; }
.block-head { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: end; justify-content: space-between; }
.block-head h2 { margin: 0; font: 700 26px/1.1 var(--f-display); }
.block-head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.search { background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 12px; width: min(320px, 100%); font: 13px var(--f-mono); color: var(--fg); }
.search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
.api { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.api-group { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; }
.api-group[hidden] { display: none; }
.api-group header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.api-group h3 { margin: 0; font: 600 15px var(--f-display); letter-spacing: .02em; }
.api-group .who { font: 11px var(--f-mono); color: var(--faint); }
.route { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 2px 10px; padding: 6px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; text-align: left; background: transparent; width: 100%; }
.route:hover, .route.on { background: var(--panel-2); border-color: var(--line); }
.route[hidden] { display: none; }
.m { font: 600 10.5px/20px var(--f-mono); letter-spacing: .04em; text-align: center; border-radius: 4px; height: 20px; }
.m.GET { color: var(--get); background: color-mix(in srgb, var(--get) 13%, transparent); }
.m.POST { color: var(--post); background: color-mix(in srgb, var(--post) 14%, transparent); }
.m.DELETE { color: var(--del); background: color-mix(in srgb, var(--del) 13%, transparent); }
.m.PATCH { color: var(--patch); background: color-mix(in srgb, var(--patch) 13%, transparent); }
.m.SSE, .m.STDIO, .m.ANY, .m.TOOL, .m.CLI { color: var(--sse); background: color-mix(in srgb, var(--sse) 13%, transparent); }
.route .p { font: 12.5px/20px var(--f-mono); word-break: break-all; }
.route .d { grid-column: 2; font-size: 12.5px; color: var(--muted); }
.prac { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.prac-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; align-content: start; }
.prac-card h3 { margin: 0; display: flex; gap: 10px; align-items: center; font: 600 16px var(--f-display); letter-spacing: .02em; }
.prac-card h3 .n { font: 500 11px var(--f-mono); color: var(--faint); }
.prac-card ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.prac-card li button { all: unset; display: block; padding: 6px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; line-height: 1.45; }
.prac-card li button:hover, .prac-card li button:focus-visible { background: var(--panel-2); }
.prac-card li button:focus-visible { outline: 2px solid var(--accent); }
footer.foot { color: var(--faint); font: 12px var(--f-mono); border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-wrap: wrap; gap: 6px 18px; }

@media (max-width: 640px) { .hint { display: none; } }
@media (max-width: 640px) { .console { grid-template-columns: minmax(0, 1fr); } .api, .prac { grid-template-columns: minmax(0, 1fr); } }
.tabs { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; width: max-content; max-width: 100%; }
.tab { display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; border-radius: 9px; padding: 8px 14px; cursor: pointer; color: var(--muted); font: 600 14px var(--f-display); letter-spacing: .02em; }
.tab svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.brandrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 600 13px var(--f-mono); color: var(--muted); letter-spacing: .06em; }
.shapes { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.shape-key { display: inline-flex; align-items: center; gap: 6px; }
.key-shape { fill: var(--panel); stroke: var(--muted); stroke-width: 1.3; }
.insp-head { display: flex; gap: 12px; align-items: flex-start; }
.insp-ico { width: 34px; height: 34px; flex: none; padding: 6px; border-radius: 10px; background: color-mix(in srgb, currentColor 12%, transparent); fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (prefers-reduced-motion: reduce) { .edge.flowing { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brandrow"><span class="brand">FINSIGHT · ARCHITECTURE</span><nav class="tabs" id="tabs" role="tablist" aria-label="Choose a map"></nav></div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>
    <div class="stats" id="stats"></div>
    <div class="legend" id="legend" aria-label="Show or hide layers"></div>
    <div class="shapes" id="shapes" aria-label="Shape key"></div>
  </header>

  <div class="console">
    <div class="flows" id="flows" role="group" aria-label="Choose a flow to animate"></div>
    <div class="transport">
      <button class="icon-btn" id="prev" aria-label="Previous step"><svg viewBox="0 0 16 16"><path d="M3 3h2v10H3zM14 3v10L6 8z"/></svg></button>
      <button class="icon-btn" id="play" aria-label="Pause"><svg viewBox="0 0 16 16" id="playIcon"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg></button>
      <button class="icon-btn" id="next" aria-label="Next step"><svg viewBox="0 0 16 16"><path d="M11 3h2v10h-2zM2 3v10l8-5z"/></svg></button>
      <label class="speed" for="speed">speed <select id="speed"><option value="0.6">0.6×</option><option value="1" selected>1×</option><option value="1.6">1.6×</option></select></label>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="mapbox">
      <div class="mapscroll" id="viewport"><svg id="map" role="img" aria-label="Architecture diagram"></svg>
        <aside class="insp" id="insp" aria-live="polite" hidden></aside>
        <div class="zoombar" id="zbar" role="toolbar" aria-label="Map controls"><button id="zToggle" class="ztoggle" aria-expanded="true" aria-controls="zitems" title="Hide controls (H)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg></button><span class="zitems" id="zitems"><button id="zOut" aria-label="Zoom out">−</button><span class="zl" id="zLevel">100%</span><button id="zIn" aria-label="Zoom in">+</button><button id="zFit" title="Fit everything (0)">Fit</button><button id="zSpot" aria-pressed="true" title="Dim parts outside the current flow">Spotlight</button><button id="zFull" title="Full screen (F)">⛶</button><span class="zsep" aria-hidden="true"></span><span class="zl">details</span><button data-pane="side" title="Details docked beside the map (D cycles)">Side</button><button data-pane="float" title="Details float over the map when you click">Float</button><button data-pane="off" title="No details panel">Off</button></span></div>

  const len = trail.getTotalLength(), mid = trail.getPointAtLength(len / 2);
  tag.textContent = st[4] || ''; tag.setAttribute('x', mid.x + 8); tag.setAttribute('y', mid.y - 10);
  cancelAnimationFrame(raf); clearTimeout(timer);
  core.setAttribute('fill', st[3] ? 'var(--panel)' : 'var(--accent)'); core.setAttribute('stroke', st[3] ? 'var(--accent)' : 'var(--panel)');
  if (still || reduce) {
    const pt = trail.getPointAtLength(len); packet.setAttribute('transform', `translate(${pt.x},${pt.y})`); packet.setAttribute('opacity', 1);
    trail.style.strokeDasharray = st[3] ? '5 5' : 'none'; trail.style.strokeDashoffset = 0;
    if (playing && !still) timer = setTimeout(() => show(stepIx + 1), 2600 / speed);
    return;
  }
  const dur = 1100 / speed, t0 = performance.now();
  trail.style.strokeDasharray = st[3] ? '5 5' : `${len} ${len}`;
  const tick = (now) => {
    const t = Math.min(1, (now - t0) / dur), e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const pt = trail.getPointAtLength(len * e);
    packet.setAttribute('transform', `translate(${pt.x},${pt.y})`); packet.setAttribute('opacity', 1);
    if (!st[3]) trail.style.strokeDashoffset = String(len * (1 - e));
    if (t < 1) raf = requestAnimationFrame(tick);
    else if (playing) timer = setTimeout(() => show(stepIx + 1), 1500 / speed);
  };
  raf = requestAnimationFrame(tick);
}

function mount(id) {
  clearTimeout(timer); cancelAnimationFrame(raf);
  D = MAPS.find((m) => m.id === id) || MAPS[0];
  [...$('tabs').children].forEach((b) => { const on = b.dataset.map === D.id; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; });
  lane = Object.fromEntries(D.lanes.map((l) => [l.id, l]));
  nodes = Object.fromEntries(D.nodes.map((n) => [n.id, { ...n, h: n.h || KIND_H[n.kind] || 54 }]));
  $('eyebrow').textContent = D.eyebrow; $('h1').textContent = D.title; $('lede').innerHTML = fmt(D.lede);
  $('stats').innerHTML = D.stats.map(([v, l]) => `<span><b>${esc(v)}</b> ${esc(l)}</span>`).join('');
  $('apiTitle').textContent = D.apiTitle; $('apiLede').innerHTML = fmt(D.apiLede); $('pracLede').innerHTML = fmt(D.pracLede);
  $('foot').innerHTML = D.foot.map((f) => `<span>${fmt(f)}</span>`).join('');

  // map
  svg.innerHTML = '';
  full = { w: D.size[0], h: D.size[1] }; fit();
  $('insp').hidden = paneMode !== 'side';
  el('title', {}, svg).textContent = D.title + ' diagram';
  const defs = el('defs', {}, svg), pat = el('pattern', { id: 'dots', width: 22, height: 22, patternUnits: 'userSpaceOnUse' }, defs);
  el('circle', { cx: 1, cy: 1, r: 1, class: 'dot' }, pat);
  el('rect', { width: D.size[0], height: D.size[1], fill: 'url(#dots)' }, svg);
  const gLanes = el('g', {}, svg), gEdges = el('g', {}, svg), gNodes = el('g', {}, svg), gFx = el('g', {}, svg);
  for (const l of D.lanes) {
    const g = el('g', {}, gLanes);
    el('rect', { x: l.x + 2, y: 12, width: l.w - 4, height: D.size[1] - 24, rx: 16, class: 'zone', fill: `var(--tint-${l.tone})`, stroke: `var(--c-${l.tone})` }, g);
    el('text', { x: l.x + 16, y: 36, class: 'lane-title', fill: `var(--c-${l.tone})` }, g).textContent = l.label;
    el('text', { x: l.x + 16, y: 52, class: 'lane-sub' }, g).textContent = l.sub;
  }
  edgeEls = D.edges.map(([from, to, label, opt]) => {
    const p = el('path', { d: curve(from, to), class: 'edge' + (opt ? ' opt' : ' flowing') }, gEdges);
    p.dataset.from = from; p.dataset.to = to; return p;
  });
  nodeEls = {};
  for (const n of Object.values(nodes)) {
    const g = el('g', { class: `node k-${n.kind}`, tabindex: 0, role: 'button', 'aria-label': `${n.name}, ${n.kindLabel}, ${lane[n.lane].label}` }, gNodes);
    g.dataset.id = n.id; g.dataset.lane = n.lane;
    drawNode(n, g);
    g.addEventListener('click', () => select(n.id, true));
    g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(n.id, true); } });
    nodeEls[n.id] = g;
  }
  packet = el('g', { class: 'packet', opacity: 0 }, gFx);
  el('circle', { r: 12, fill: 'var(--accent)', 'fill-opacity': .18 }, packet);
  core = el('circle', { r: 5.5, fill: 'var(--accent)', stroke: 'var(--panel)', 'stroke-width': 2 }, packet);
  trail = el('path', { class: 'pathtmp' }, gFx);
  tag = el('text', { class: 'edge-label' }, gFx);

  // shape key + layer toggles
  hidden.clear();
  $('legend').innerHTML = '';
  for (const l of D.lanes) {
    const b = h('button', 'leg', `<span class="swatch" style="background:var(--c-${l.tone})"></span>${esc(l.label)}`);
    b.setAttribute('aria-pressed', 'true');
    b.addEventListener('click', () => {
      const on = b.getAttribute('aria-pressed') === 'true'; b.setAttribute('aria-pressed', String(!on));
      on ? hidden.add(l.id) : hidden.delete(l.id);
      for (const g of Object.values(nodeEls)) g.style.opacity = hidden.has(g.dataset.lane) ? .1 : '';
      for (const p of edgeEls) p.style.opacity = hidden.has(nodes[p.dataset.from].lane) || hidden.has(nodes[p.dataset.to].lane) ? .05 : '';
    });
    $('legend').appendChild(b);
  }
  const kinds = [...new Map(D.nodes.map((n) => [n.kind, n])).values()];
  $('shapes').innerHTML = kinds.map((n) => {
    const w = 46, hh = 26, p = shapePath(n.kind, 2, n.kind === 'cloud' ? 2 : 4, w, n.kind === 'cloud' ? 26 : 22);
    return `<span class="shape-key"><svg viewBox="0 0 50 ${hh + 4}" width="50" height="${hh + 4}"><path d="${p}" class="key-shape"/></svg>${esc(n.kindLabel)}</span>`;
  }).join('');

  // flows
  $('flows').innerHTML = '';
  D.flows.forEach((f, i) => {
    const b = h('button', 'flow-btn', esc(f.name)); b.title = f.desc || '';
    b.addEventListener('click', () => { playing = true; setPlayIcon(); start(i, 0); });
    $('flows').appendChild(b);
  });

  // API catalogue
  const apiBox = $('api'); apiBox.innerHTML = ''; $('q').value = '';
  for (const g of D.apis) {
    const card = h('div', 'api-group');
    card.innerHTML = `<header><h3>${esc(g.group)}</h3><span class="who">${esc(g.who || '')}</span></header>`;
    for (const [m, p, d] of g.routes) {
      const r = h('button', 'route', `<span class="m ${m}">${m}</span><span class="p">${esc(p)}</span><span class="d">${fmt(d)}</span>`);
      r.dataset.search = (m + ' ' + p + ' ' + d + ' ' + g.group).toLowerCase();
      r.addEventListener('click', () => {
        stop(); apiBox.querySelectorAll('.route.on').forEach((x) => x.classList.remove('on')); r.classList.add('on');
        light(g.nodes, between(g.nodes)); select(g.nodes[g.nodes.length - 1], false);
        $('ntext').innerHTML = `<b><span class="m ${m}" style="display:inline-block;padding:0 6px">${m}</span> ${esc(p)}</b> · touches ${g.nodes.map((i) => esc(nodes[i].name)).join(' → ')}`;
        $('count').textContent = 'ROUTE';
        document.querySelector('.mapbox').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' });
      });
      card.appendChild(r);
    }
    apiBox.appendChild(card);
  }

  // practices
  $('prac').innerHTML = '';
  D.practices.forEach((c) => {
    const card = h('div', 'prac-card', `<h3>${esc(c.title)} <span class="n">${c.items.length}</span></h3>`);
    const ul = h('ul');
    for (const [text, ids] of c.items) {
      const li = h('li'), b = h('button', null, fmt(text));
      const on = () => { stop(); light(ids, between(ids)); select(ids[0], false); };
      b.addEventListener('mouseenter', on); b.addEventListener('focus', on);
      b.addEventListener('click', () => { on(); document.querySelector('.mapbox').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' }); });
      li.appendChild(b); ul.appendChild(li);
    }
    card.appendChild(ul); $('prac').appendChild(card);
  });

  selected = null; playing = !reduce; setPlayIcon(); start(0, 0);
}

// one-time wiring
for (const m of MAPS) {
  const b = h('button', 'tab', `<svg viewBox="0 0 24 24"><path d="${ICONS[m.tabIcon]}"/></svg><span>${esc(m.tab)}</span>`);
  b.setAttribute('role', 'tab'); b.dataset.map = m.id;
  b.addEventListener('click', () => { if (location.hash !== '#' + m.id) location.hash = m.id; else mount(m.id); });
  $('tabs').appendChild(b);
}
$('tabs').addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  e.stopPropagation();
  const i = MAPS.findIndex((m) => m.id === D.id), j = (i + (e.key === 'ArrowRight' ? 1 : -1) + MAPS.length) % MAPS.length;
  location.hash = MAPS[j].id; $('tabs').children[j].focus();
});
addEventListener('hashchange', () => { mount(location.hash.slice(1)); window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); });
$('play').addEventListener('click', () => { playing = !playing; setPlayIcon(); if (playing) show(stepIx + 1); else clearTimeout(timer); });
$('next').addEventListener('click', () => { stop(); show(stepIx + 1, true); });
$('prev').addEventListener('click', () => { stop(); show(stepIx - 1, true); });
$('speed').addEventListener('change', (e) => { speed = Number(e.target.value) || 1; });
$('q').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  for (const card of $('api').children) {
    let any = false;
    for (const r of card.querySelectorAll('.route')) { const ok = !q || r.dataset.search.includes(q); r.hidden = !ok; any ||= ok; }
    card.hidden = !any;
  }
});
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, select, textarea, [role=tab]')) return;
  if (e.key === 'ArrowRight') { stop(); show(stepIx + 1, true); }
  else if (e.key === 'ArrowLeft') { stop(); show(stepIx - 1, true); }
  else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('play').click(); }
});

// ---- zoom & pan: the whole map always fits; zoom in where you point ----
function setVB(n) {
  const minW = full.w / 5, maxW = full.w * 1.25;
  const w = Math.min(maxW, Math.max(minW, n.w)), hh = w * (full.h / full.w);
  vb = { x: n.x + (n.w - w) / 2 * (n.keep ? 0 : 1), y: n.y + (n.h - hh) / 2 * (n.keep ? 0 : 1), w, h: hh };
  if (n.keep) { vb.x = n.x; vb.y = n.y; }
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  $('zLevel').textContent = Math.round(full.w / vb.w * 100) + '%';
}
function fit() { setVB({ x: 0, y: 0, w: full.w, h: full.h, keep: true }); }
function svgPoint(cx, cy) { const p = svg.createSVGPoint(); p.x = cx; p.y = cy; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function zoomAt(factor, cx, cy) {
  const r = svg.getBoundingClientRect();
  const p = svgPoint(cx ?? r.left + r.width / 2, cy ?? r.top + r.height / 2);
  const w = Math.min(full.w * 1.25, Math.max(full.w / 5, vb.w / factor)), k = w / vb.w;
  setVB({ x: p.x - (p.x - vb.x) * k, y: p.y - (p.y - vb.y) * k, w, h: vb.h * k, keep: true });
}
const vp = $('viewport');
vp.addEventListener('wheel', (e) => { if (e.target.closest('.insp')) return; e.preventDefault(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018)), e.clientX, e.clientY); }, { passive: false });
let drag = null;
vp.addEventListener('pointerdown', (e) => { if (e.target.closest('.insp, .zoombar') || e.button !== 0) return; drag = { x: e.clientX, y: e.clientY, vb: { ...vb }, moved: false }; });
addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true; vp.classList.add('panning');
  const u = 1 / svg.getScreenCTM().a;
  setVB({ x: drag.vb.x - dx * u, y: drag.vb.y - dy * u, w: drag.vb.w, h: drag.vb.h, keep: true });
});
addEventListener('pointerup', () => { if (drag?.moved) { const stopClick = (ev) => { ev.stopPropagation(); ev.preventDefault(); }; addEventListener('click', stopClick, { capture: true, once: true }); setTimeout(() => removeEventListener('click', stopClick, { capture: true }), 0); } drag = null; vp.classList.remove('panning'); });
$('zIn').addEventListener('click', () => zoomAt(1.3));
$('zOut').addEventListener('click', () => zoomAt(1 / 1.3));
$('zFit').addEventListener('click', fit);
$('zSpot').addEventListener('click', () => { spotlight = !spotlight; $('zSpot').setAttribute('aria-pressed', String(spotlight)); if (!spotlight) svg.classList.remove('dimming'); else if (svg.querySelector('.node.lit')) svg.classList.add('dimming'); });
$('zFull').addEventListener('click', () => { const box = document.querySelector('.mapbox'); document.fullscreenElement ? document.exitFullscreen() : box.requestFullscreen?.(); });
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, select, textarea')) return;
  if (e.key === '+' || e.key === '=') zoomAt(1.3); else if (e.key === '-') zoomAt(1 / 1.3);
  else if (e.key === '0') fit(); else if (e.key === 'f' || e.key === 'F') $('zFull').click();
  else if (e.key === 'Escape' && paneMode === 'float') $('insp').hidden = true;
  else if (e.key === 'h' || e.key === 'H') $('zToggle').click();
  else if (e.key === 'd' || e.key === 'D') setPane({ side: 'float', float: 'off', off: 'side' }[paneMode]);
});
// details panel: docked beside the map, floating over it, or off
function setPane(m) {
  paneMode = m; try { localStorage.setItem('archPane', m); } catch {}
  const insp = $('insp');
  $('stage').classList.toggle('side', m === 'side');
  if (m === 'side') $('stage').appendChild(insp); else vp.insertBefore(insp, vp.querySelector('.zoombar'));
  insp.hidden = m !== 'side';
  if (m === 'side' && selected) select(selected, false);
  document.querySelectorAll('[data-pane]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.pane === m)));
}
document.querySelectorAll('[data-pane]').forEach((b) => b.addEventListener('click', () => setPane(b.dataset.pane)));
// controls collapse to a single button so they never hide the map
function setBar(open) {
  $('zbar').classList.toggle('collapsed', !open);
  $('zToggle').setAttribute('aria-expanded', String(open));
  $('zToggle').title = open ? 'Hide controls (H)' : 'Show map controls (H)';
  try { localStorage.setItem('archBar', open ? '1' : '0'); } catch {}
}
$('zToggle').addEventListener('click', () => setBar($('zbar').classList.contains('collapsed')));
setBar((() => { try { return localStorage.getItem('archBar') !== '0'; } catch { return true; } })());
setPane(paneMode);
mount(location.hash.slice(1));
</script>
</body>
