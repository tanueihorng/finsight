[project]
name = "finsight-quant"
version = "0.1.0"
description = "Deterministic portfolio replay and metrics worker for Kestrel (FEAT-014)."
requires-python = ">=3.11"
dependencies = ["numpy==2.1.3"]

# Independent checkers. Installed only in .venv-verify, never in the worker.
[dependency-groups]
verify = ["arch>=7", "hypothesis>=6.100", "vectorbt", "empyrical-reloaded", "pandas", "plotly<6"]

[tool.uv]
package = false
default-groups = []
