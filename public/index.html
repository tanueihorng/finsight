<script>/* apply saved theme/font before first paint (no flash) */
try { var d = document.documentElement;
  d.dataset.theme = localStorage.getItem('finsight-theme') || 'violet';
  d.dataset.font  = localStorage.getItem('finsight-font')  || 'mono';
} catch (e) {}</script>
<script>/* start the first requests now, while the scripts load (H1). For a
   signed-in session that is its accounts and the portfolio the app will show
   first, chosen as web/src/state/store.ts and shell/boot.ts choose them; the
   app takes each once (web/src/api/early.ts) and fetches anything that does
   not match. Bodies are read at once: an unread one would hold a connection.
   A page that was signed in last time (finsight-signed-in, kept by boot.ts and
   cleared on every lock) asks for its accounts and saved account's portfolio
   at once, beside the session check: on a warm load the app's own script
   would otherwise hold these requests back. If that session has since
   expired they get a 401 and are ignored. Any other locked page sends no
   protected request. */
try { (function () {
  var get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var opts = { credentials: 'same-origin', headers: { Accept: 'application/json' } };
  var body = function (r) { return r.ok ? r.json() : null; };
  var early = window.finsightEarly = {};
  early.auth = fetch('/api/auth/status', { credentials: 'same-origin' }).then(function (r) { if (!r.ok) throw new Error(); return r.json(); });
  var hinted = get('finsight-signed-in') === '1', saved = get('finsight-account') || get('fincept-account') || '';
  var base = (get('finsight-base') || get('fincept-base') || 'SGD').toUpperCase();
  var portfolioFor = function (account) {
    var url = '/api/portfolio?base=' + encodeURIComponent(base) + '&account=' + encodeURIComponent(account);
    early.portfolio = { url: url, data: fetch(url, opts).then(body) };
    early.portfolio.data.catch(function () {});
  };
  var accounts = function () { return fetch('/api/accounts', opts).then(body); };
  early.accounts = hinted ? accounts() : early.auth.then(function (s) { return s.authed ? accounts() : null; });
  if (hinted && saved) portfolioFor(saved); // used only if the app settles on this same account
  var portfolio = hinted && saved ? Promise.resolve() : early.accounts.then(function (d) {
    if (!d) return;
    var list = d.accounts || [], exists = function (id) { return id === 'ALL' || list.some(function (a) { return a.id === id; }); };
    var account = saved;
    if (!exists(account)) account = exists(get('finsight-account')) ? get('finsight-account') : d.activeId;
    portfolioFor(account);
  });
  early.auth.catch(function () {}); early.accounts.catch(function () {}); portfolio.catch(function () {});
})(); } catch (e) {}</script>

<body class="locked">
  <!-- The page is one React app (X1, web/src/App.tsx). Startup order: bootstrap
       (store, auth, bus) -> the app module, which loads the classic chart
       scripts (window.PriceChart and its helpers, still plain JS) when it
       starts (web/src/legacy/chartScripts.ts). See web/src/bootstrap.ts. -->
  <div id="root"></div>
  <!-- Startup fallback: inline in index.html so it works even when bootstrap or
       the app bundle fails to load. If React never renders, reveal a retry
       message instead of a blank page; the first successful render removes it. -->
  <div id="boot-fallback" class="boot-fallback" hidden>
    <div class="boot-fallback-box" role="alert">
      <strong>FinSight could not start</strong>
      The app files may be incomplete or outdated. Your data is safe on this
      computer. Reload to try again; if it keeps failing, restart the server
      (node server.ts or start.command).
      <button id="boot-retry" type="button">Reload</button>
    </div>
  </div>
  <script>
    (function () {
      var root = document.getElementById('root'), fb = document.getElementById('boot-fallback');
      if (root.childElementCount) { fb.remove(); return; }
      var reveal = setTimeout(function () { if (!root.childElementCount) fb.hidden = false; }, 5000);
      new MutationObserver(function () {
        if (root.childElementCount) { clearTimeout(reveal); fb.remove(); }
      }).observe(root, { childList: true });
      document.getElementById('boot-retry').addEventListener('click', function () { location.reload(); });
    })();
  </script>
  <script src="/app/bootstrap.js"></script>
  <link rel="stylesheet" href="/app/main.css" />
  <script type="module" src="/app/main.js"></script>
</body>
