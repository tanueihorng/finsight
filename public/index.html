<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<script>/* apply saved theme/font before first paint (no flash) */
try { var d = document.documentElement;
  d.dataset.theme = localStorage.getItem('finsight-theme') || 'violet';
  d.dataset.font  = localStorage.getItem('finsight-font')  || 'mono';
} catch (e) {}</script>
</head>
<body class="locked">
  <!-- The page is one React app (X1, web/src/App.tsx). Startup order: bootstrap
       (store, auth, bus) -> classic chart scripts (window.PriceChart and its
       helpers, still plain JS) -> the app module. See web/src/bootstrap.ts. -->
  <div id="root"></div>
  <script src="/app/bootstrap.js"></script>
  <script src="/indicators.js"></script>
  <script src="/strategy.js"></script>
  <script src="/strategies.js"></script>
  <script src="/chart.js"></script>
  <script src="/chartgrid.js"></script>

</body>
