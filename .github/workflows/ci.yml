name: CI

on:
  # Every PR runs, so the required "CI result" check always reports; docs-only PRs skip the work (see `changes`).
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', 'LICENSE']
  workflow_dispatch:

# A newer push to the same PR or branch cancels the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: Asia/Singapore # tests are written and verified in SGT; DST and midnight cases depend on it
  CI: 'true'

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "$files"
          # Anything outside docs/, top-level Markdown and LICENSE counts as code. An empty diff counts as code too.
          if [ -z "$files" ] || echo "$files" | grep -qvE '^(docs/|[^/]+\.md$|LICENSE$)'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  checks:
    name: Typecheck, unit tests, web build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:web

  agent:
    name: Kestrel agent, quant worker, secret scan
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          # The runner's own python3 (3.14) has no numpy 2.1.3 wheel, so uv compiled
          # numpy from source for 3 min each run. 3.12 matches local development.
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: agent/quant/uv.lock
      - run: npm run agent:install
      # The worker's venv lets the agent's quant tests run instead of skipping.
      - run: uv sync --project agent/quant --frozen
      - run: npm run agent:test
      - run: npm run quant:test

  e2e:
    name: Browser suite (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_SKIP_VISUAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Shards are balanced by run time (scripts/e2e-shard.mjs), not test count.
      - run: |
          files=$(node scripts/e2e-shard.mjs ${{ matrix.shard }} 4)
          npx playwright test $files
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # The one check branch protection requires. Skipped jobs (docs-only PRs) count as passing.
  result:
    name: CI result
    needs: [changes, checks, agent, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: |
          echo "Job results: $RESULTS"
          if [ "$FAILED" = true ]; then exit 1; fi
